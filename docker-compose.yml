services:
  mysql:
    image: mysql:8.4
    container_name: react-nest-starter-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: starter
      MYSQL_USER: starter
      MYSQL_PASSWORD: starter
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ustarter", "-pstarter"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
